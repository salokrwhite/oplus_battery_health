<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <link rel="stylesheet" href="/internal/insets.css" />
  <title>电池健康</title>
  <link rel="stylesheet" href="./style.css?v=1.0.0" />
</head>

<body>
  <main class="page">
    <header class="header">
      <h1>电池健康</h1>
      <span id="device" class="badge">…</span>
    </header>

    <section class="hero" id="hero">
      <div class="hero-main">
        <div class="pct"><span id="pct">--</span><em>%</em></div>
        <div class="hero-side">
          <span class="chip" id="levelChip">未读取</span>
          <div class="sub" id="sub">点击下方按钮开始读取</div>
        </div>
      </div>
      <div class="bar"><i id="bar"></i></div>
      <div class="legend" id="legend"></div>
    </section>

    <button id="readBtn" class="btn dark wide" onclick="readAll()">读取电池健康</button>

    <section class="panel">
      <div class="panel-head">
        <span class="ph-label">核心参数</span>
        <span class="count" id="coreCount">—</span>
      </div>
      <div class="rows" id="coreRows"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <span class="ph-label">附加信息</span>
      </div>
      <div class="rows" id="liveRows"></div>
    </section>

    <p class="notice">
      本模块尽可能复刻售后工具读取电池健康的相关流程，结果具有较高的参考价值。
      受设备型号、系统版本及固件差异影响，最终请以售后工具检测结果为准。
      本模块最后更新时间 2026年10月8日
    </p>

    <footer class="copyright">© 小白科学院</footer>

    <div id="toast" class="toast"></div>
  </main>

  <script src="./app.js?v=1.0.0"></script>
</body>

</html>
